<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Command Center - REST API Aggregator</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body { padding: 0; margin: 0; overflow: hidden; }
        .command-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            height: 100vh;
            gap: 10px;
            padding: 10px;
            background: var(--bg-dark);
        }
        .pane {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            overflow: hidden;
            position: relative;
        }
        .pane-tall {
            grid-row: span 2;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }
    </style>
</head>
<body onload="if(window.self !== window.top) document.body.classList.add('minimal')">
    <div class="command-grid">
        <div class="pane pane-tall">
            <iframe src="/dashboard-view.html"></iframe>
        </div>
        <div class="pane">
            <iframe src="/queue.html"></iframe>
        </div>
        <div class="pane">
            <iframe src="/status.html"></iframe>
        </div>
        <div class="pane">
            <iframe src="/billing.html"></iframe>
        </div>
        <div class="pane">
            <iframe src="/shipping.html"></iframe>
        </div>
    </div>
</body>
</html>
