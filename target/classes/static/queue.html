<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting Orders Queue</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .queue-stat {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 1rem;
            padding: 1.5rem;
            text-align: center;
            margin-bottom: 1rem;
        }
        .queue-number {
            font-size: 3rem;
            font-weight: 700;
            color: var(--primary);
        }
        .queue-label {
            color: var(--text-dim);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body onload="if(window.self !== window.top) document.body.classList.add('minimal')">
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    <div class="container animate-fade">
        <nav class="nav-bar">
            <a href="/" class="nav-link">Dashboard</a>
            <a href="/entry.html" class="nav-link">Order Entry</a>
            <a href="/billing.html" class="nav-link">Billing</a>
            <a href="/shipping.html" class="nav-link">Shipping</a>
        </nav>
        <header>
            <h1>Queue Dashboard</h1>
            <p>Live order waiting lines</p>
        </header>

        <div class="dashboard-grid">
            <div class="queue-stat">
                <div class="queue-number" id="pending-count">0</div>
                <div class="queue-label">Pending Billing</div>
            </div>
            <div class="queue-stat">
                <div class="queue-number" id="billed-count">0</div>
                <div class="queue-label">Pending Shipping</div>
            </div>
            <div class="queue-stat">
                <div class="queue-number" id="shipped-count" style="color: var(--success)">0</div>
                <div class="queue-label">Completed Orders</div>
            </div>
        </div>
    </div>

    <script>
        async function fetchQueue() {
            try {
                const res = await fetch('/camel/orders/summary');
                const summary = await res.json();
                document.getElementById('pending-count').innerText = summary.PENDING || 0;
                document.getElementById('billed-count').innerText = summary.BILLED || 0;
                document.getElementById('shipped-count').innerText = summary.SHIPPED || 0;
            } catch (e) {
                console.error("Queue fetch error", e);
            }
        }
        fetchQueue();
        setInterval(fetchQueue, 2000);
    </script>
</body>
</html>
