name: Nightly Dependency Update

on:
  schedule:
    - cron: '0 2 * * *' # Runs at 02:00 UTC every day
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.2.0
        with:
          node-version: '24'

      - name: Configure Git for automated commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Update dependencies
        run: |
          # Update only safe properties and explicit dependency versions.
          # Avoid updating platform-sensitive properties like Camel versions automatically.
          mvn versions:update-properties "-DexcludeProperties=camel.version,spring-boot.version,spring-security.version,tomcat.version" -DallowSnapshots=false -DgenerateBackupPoms=false
          mvn versions:use-latest-versions -DallowSnapshots=false -DgenerateBackupPoms=false -DallowMajorUpdates=false "-Dexcludes=com.giffing.bucket4j.spring.boot.starter:bucket4j-spring-boot-starter,org.springframework.boot:spring-boot-starter-parent"

      - name: Display Dependency Tree
        run: |
          echo "Outputting updated dependency tree..."
          mvn dependency:tree

      - name: Restore NVD Cache from jsoehner/nvd-cache
        run: |
          mkdir -p ~/.m2/repository/org/owasp/dependency-check-data/11.0
          curl -fsSL -o /tmp/odc.mv.db.zip \
            https://github.com/jsoehner/nvd-cache/releases/download/latest-nvd-data/odc.mv.db.zip
          unzip -q -o /tmp/odc.mv.db.zip -d ~/.m2/repository/org/owasp/dependency-check-data/11.0/
          cp -f ~/.m2/repository/org/owasp/dependency-check-data/11.0/odc.mv.db ~/.m2/repository/org/owasp/dependency-check-data/odc.mv.db
          rm -f /tmp/odc.mv.db.zip

      - name: Build and Verify with SCA
        run: |
          echo "Triggering rebuild with updated dependencies and SCA analysis..."
          mvn clean verify -Dspotbugs.skip=true

      - name: Clean generated artifacts from branch
        run: |
          echo "Removing generated build artifacts from the index so they are not committed."
          git rm -r --cached target || true
          git status --short

      - name: Resolve PR creation token
        id: pr-token
        env:
          PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          USE_PAT="false"
          if [ -n "$PAT" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token $PAT" https://api.github.com/user || true)
            if [ "$STATUS" = "200" ]; then
              echo "Using verified PERSONAL_ACCESS_TOKEN"
              TOKEN="$PAT"
              USE_PAT="true"
            else
              echo "PERSONAL_ACCESS_TOKEN is invalid or expired (HTTP $STATUS), falling back to direct main push via GITHUB_TOKEN"
            fi
          else
            echo "PERSONAL_ACCESS_TOKEN not set, falling back to direct main push via GITHUB_TOKEN"
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "use_pat=$USE_PAT" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: create-pr
        if: steps.pr-token.outputs.use_pat == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        continue-on-error: true
        with:
          token: ${{ steps.pr-token.outputs.token }}
          commit-message: "chore(deps): update maven dependencies"
          title: "Automated Maven Dependency Update"
          body: |
            This PR contains automated dependency updates generated by the nightly workflow.
            The dependencies were updated, and a successful build was triggered.
            Check the workflow logs to see the output of `mvn dependency:tree`.
          branch: "automated/maven-dependency-updates"
          delete-branch: true
          assignees: "jsoehner"
          labels: "automated-dependency-update"

      - name: Auto-merge Pull Request
        if: steps.create-pr.outputs.pull-request-number
        run: |
          PR_URL="${{ steps.create-pr.outputs.pull-request-url }}"
          echo "Queueing auto-merge for $PR_URL pending status checks..."
          gh pr merge "$PR_URL" --auto --squash --delete-branch || echo "Auto-merge registered or PR queued for checks"
        env:
          GITHUB_TOKEN: ${{ steps.pr-token.outputs.token }}

      - name: Commit and Push Verified Updates Directly (Fallback when PAT unavailable)
        if: steps.pr-token.outputs.use_pat == 'false'
        run: |
          if [ -n "$(git status --porcelain pom.xml)" ]; then
            git add pom.xml
            git commit -m "chore(deps): update maven dependencies [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No dependency updates to commit."
          fi

      - name: Notify manual PR approval needed
        if: ${{ always() && steps.create-pr.outcome == 'failure' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const bodyText = `The automated dependency branch \`automated/maven-dependency-updates\` passed build verification but pull request creation failed.\n\nPlease check the workflow logs for step 'Create Pull Request' and review permissions.\n\nBranch: https://github.com/${owner}/${repo}/tree/automated/maven-dependency-updates\n\nRequested reviewer: @jsoehner`;
            try {
              await github.rest.issues.create({
                owner,
                repo,
                title: 'Automated dependency branch ready for manual PR',
                body: bodyText,
                assignees: ['jsoehner']
              });
            } catch (err) {
              console.log("Failed creating issue with assignees, retrying without optional fields:", err.message);
              await github.rest.issues.create({
                owner,
                repo,
                title: 'Automated dependency branch ready for manual PR',
                body: bodyText
              });
            }
