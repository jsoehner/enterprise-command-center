name: Nightly Dependency Update

on:
  schedule:
    - cron: '0 2 * * *' # Runs at 02:00 UTC every day
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21' # Using Java 21 based on typical modern projects
          distribution: 'temurin'
          cache: maven

      - name: Update dependencies
        run: |
          # Update only safe properties and explicit dependency versions.
          # Avoid updating platform-sensitive properties like Camel and Tomcat versions automatically.
          mvn versions:update-properties -DexcludeProperties=camel.version,tomcat.version,spring-security.version,netty.version,kafka.version -DallowSnapshots=false -DgenerateBackupPoms=false
          mvn versions:use-latest-versions -DallowSnapshots=false -DgenerateBackupPoms=false -DallowMajorUpdates=false -Dexcludes=com.giffing.bucket4j.spring.boot.starter:bucket4j-spring-boot-starter

      - name: Display Dependency Tree
        run: |
          echo "Outputting updated dependency tree..."
          mvn dependency:tree

      - name: Build and Verify
        run: |
          echo "Triggering rebuild with updated dependencies..."
          mvn clean verify

      - name: Clean generated artifacts from branch
        run: |
          echo "Removing generated build artifacts from the index so they are not committed."
          git rm -r --cached target || true
          git status --short

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        continue-on-error: true
        env:
          PR_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          token: ${{ env.PR_TOKEN || github.token }}
          commit-message: "chore(deps): update maven dependencies"
          title: "Automated Maven Dependency Update"
          body: |
            This PR contains automated dependency updates generated by the nightly workflow.
            The dependencies were updated, and a successful build was triggered.
            Check the workflow logs to see the output of `mvn dependency:tree`.
          branch: "automated/maven-dependency-updates"
          delete-branch: true
          assignees: "jsoehner"
          reviewers: "jsoehner"
          labels: "automated-dependency-update"

      - name: Notify manual PR approval needed
        if: ${{ always() && steps.create-pr.outcome == 'failure' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            await github.rest.issues.create({
              owner,
              repo,
              title: 'Automated dependency branch ready for manual PR',
              body: `The automated dependency branch \`automated/maven-dependency-updates\` passed build verification but pull request creation was blocked by repository policy.

Please review the branch and create the PR manually, or configure PERSONAL_ACCESS_TOKEN for automated PR creation.

Branch: https://github.com/${owner}/${repo}/tree/automated/maven-dependency-updates

Requested reviewer: @jsoehner`,
              assignees: ['jsoehner'],
              labels: ['dependency-update']
            });
