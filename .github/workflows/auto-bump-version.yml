name: Auto Bump Version

on:
  push:
    branches:
      - main

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.2.0
        with:
          node-version: '24'

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Version in pom.xml
        run: |
          # Only bump if the commit message doesn't already contain [skip ci]
          if [[ "${{ github.event.head_commit.message }}" != *"[skip ci]"* ]]; then
            mvn build-helper:parse-version versions:set -DnewVersion=\${parsedVersion.majorVersion}.\${parsedVersion.minorVersion}.\${parsedVersion.nextIncrementalVersion}-SNAPSHOT versions:commit
            
            # Check if pom.xml was modified
            if [[ -n $(git status -s pom.xml) ]]; then
              git add pom.xml
              git commit -m "chore: auto-bump version to $(mvn help:evaluate -Dexpression=project.version -q -DforceStdout) [skip ci]"
              git push
            else
              echo "No version bump needed."
            fi
          else
            echo "Skipping version bump due to [skip ci] flag in commit message."
          fi
