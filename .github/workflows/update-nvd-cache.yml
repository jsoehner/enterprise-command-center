name: Update NVD Cache

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  workflow_dispatch:

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.2.0
        with:
          node-version: '24'

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Restore NVD Cache from jsoehner/nvd-cache
        run: |
          mkdir -p ~/.m2/repository/org/owasp/dependency-check-data/11.0
          curl -fsSL -o /tmp/odc.mv.db.zip \
            https://github.com/jsoehner/nvd-cache/releases/download/latest-nvd-data/odc.mv.db.zip
          unzip -q -o /tmp/odc.mv.db.zip -d ~/.m2/repository/org/owasp/dependency-check-data/11.0/
          cp -f ~/.m2/repository/org/owasp/dependency-check-data/11.0/odc.mv.db ~/.m2/repository/org/owasp/dependency-check-data/odc.mv.db
          rm -f /tmp/odc.mv.db.zip

      - name: Update NVD Database
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "NVD_API_KEY not found. Retaining pre-cached NVD database from jsoehner/nvd-cache."
          else
            echo "Updating NVD database using API key..."
            mvn -B org.owasp:dependency-check-maven:update-only -DautoUpdate=true -DnvdApiKey=$NVD_API_KEY
          fi

      - name: Save NVD Cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.0.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-owasp-nvd-${{ github.run_id }}
