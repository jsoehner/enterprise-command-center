name: Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  security-assessment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.2.0
        with:
          node-version: '24'

      - name: Run Gitleaks (Secrets Scan)
        id: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: SAST Scanning (SpotBugs)
        id: spotbugs
        continue-on-error: true
        run: mvn -B compile test-compile com.github.spotbugs:spotbugs-maven-plugin:4.9.2.0:spotbugs -Dspotbugs.failOnError=false || true

      - name: Restore OWASP Dependency Check Data
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.0.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-owasp-nvd-
          restore-keys: |
            ${{ runner.os }}-owasp-nvd-

      - name: SCA Scanning (OWASP Dependency-Check)
        id: dependency-check
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          MAVEN_OPTS: "--add-modules jdk.incubator.vector"
        run: |
          mvn -B org.owasp:dependency-check-maven:check -Dformats=JSON,HTML -DossindexAnalyzerEnabled=false -DautoUpdate=false
        
      - name: Container & FS Scanning (Trivy)
        id: trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Parse scan reports
        if: ${{ always() }}
        run: node .github/scripts/parse-findings.js

      - name: Notify on security findings
        if: ${{ always() }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.runId;
            
            if (fs.existsSync('findings-table.md')) {
              if (context.eventName === 'pull_request') {
                console.log('Security findings detected on PR; results available in CI checks.');
                return;
              }

              let body = `The security scan workflow detected potential security findings in the codebase.\n\n`;
              body += `Please review the workflow run logs for details: https://github.com/${owner}/${repo}/actions/runs/${runId}\n\n`;
              body += fs.readFileSync('findings-table.md', 'utf8');
              
              // Create GitHub issue
              await github.rest.issues.create({
                owner,
                repo,
                title: 'Security Scan: Findings Detected',
                body: body,
                assignees: ['jsoehner'],
                labels: ['security', 'automated-scan']
              });

              // Trigger Automated Dependency Update
              console.log('Triggering automated dependency update workflow...');
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: 'nightly-dependency-update.yml',
                  ref: context.ref || 'main'
                });
                console.log('Successfully triggered dependency update workflow.');
              } catch (error) {
                console.error('Failed to trigger dependency update workflow:', error);
              }
            } else {
              console.log('No security findings table generated; scan completed cleanly.');
            }
