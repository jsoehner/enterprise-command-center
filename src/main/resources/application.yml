server:
  port: 8080

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: rest-api-aggregator
  cache:
    cache-names: buckets
    caffeine:
      spec: expireAfterWrite=1h
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

aggregator:
  backends:
    - name: user
      endpoint: direct:fetch-user
    - name: order
      endpoint: direct:fetch-order
    - name: inventory
      endpoint: direct:fetch-inventory

camel:
  component:
    spring-boot:
      auto-startup: true
  rest:
    api-context-path: /api-doc
    api-property:
      api-title: REST API Aggregator
      api-version: 1.0.0
      scan-include: com.camel.aggregator
  springboot:
    name-length-diff: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0

# Redis configuration for caching
spring.data.redis:
  host: localhost
  port: 6379
  timeout: 2000ms

# Rate Limiting
bucket4j:
  enabled: true
  cache-to-use: redis
  filters:
    - cache-name: buckets
      url: /camel/api/.*
      filter-order: -10
      http-response-body: '{"status": 429, "error": "Too Many Requests"}'
      rate-limits:
        - bandwidths:
            - capacity: 5
              time: 1
              unit: minutes

# Logging
logging:
  level:
    com.camel.aggregator: INFO
    org.apache.camel: WARN
    com.giffing.bucket4j: INFO

# Security Credentials
app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
