<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Command Center - REST API Aggregator</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body { padding: 0; margin: 0; overflow: hidden; background: #0f172a; }
        .command-grid {
            display: grid;
            grid-template-columns: 1.35fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            height: 100vh;
            gap: 8px;
            padding: 8px;
            box-sizing: border-box;
            background: #0f172a;
        }
        .pane {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        .pane-tall {
            grid-row: span 2;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: transparent;
        }
    </style>
</head>
<body onload="if(window.self !== window.top) document.body.classList.add('minimal')">
    <div class="command-grid">
        <div class="pane pane-tall">
            <iframe src="/dashboard-view.html"></iframe>
        </div>
        <div class="pane">
            <iframe src="/queue.html"></iframe>
        </div>
        <div class="pane">
            <iframe src="/status.html"></iframe>
        </div>
        <div class="pane">
            <iframe src="/billing.html"></iframe>
        </div>
        <div class="pane">
            <iframe src="/shipping.html"></iframe>
        </div>
    </div>
</body>
</html>
