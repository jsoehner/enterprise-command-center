<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Status Board</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .status-indicator {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
        }
        .status-indicator.down {
            background: #ef4444; /* Red */
            box-shadow: 0 0 10px #ef4444;
            animation: pulse-red 1s infinite;
        }
        @keyframes pulse-red {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body onload="if(window.self !== window.top) document.body.classList.add('minimal')">
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    <div class="container animate-fade">
        <nav class="nav-bar">
            <a href="/" class="nav-link">Dashboard</a>
            <a href="/entry.html" class="nav-link">Order Entry</a>
            <a href="/billing.html" class="nav-link">Billing</a>
            <a href="/shipping.html" class="nav-link">Shipping</a>
        </nav>
        <header>
            <h1>System Status</h1>
            <p>Live microservice health</p>
        </header>

        <div id="status-list">
            <!-- Status items will be injected here -->
        </div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const res = await fetch('/camel/health/status');
                const statuses = await res.json();
                const list = document.getElementById('status-list');
                list.innerHTML = ''; // Clear current
                
                Object.keys(statuses).forEach(service => {
                    const isUp = statuses[service] === 'UP';
                    const div = document.createElement('div');
                    div.className = 'status-item';

                    const nameSpan = document.createElement('span');
                    nameSpan.style.fontWeight = '600';
                    nameSpan.textContent = service;

                    const statusWrap = document.createElement('div');
                    statusWrap.style.display = 'flex';
                    statusWrap.style.alignItems = 'center';
                    statusWrap.style.gap = '0.5rem';

                    const textSpan = document.createElement('span');
                    textSpan.style.fontSize = '0.8rem';
                    textSpan.style.color = 'var(--text-dim)';
                    textSpan.textContent = statuses[service] || '';

                    const indicator = document.createElement('div');
                    indicator.className = `status-indicator ${isUp ? '' : 'down'}`;

                    statusWrap.appendChild(textSpan);
                    statusWrap.appendChild(indicator);

                    div.appendChild(nameSpan);
                    div.appendChild(statusWrap);
                    list.appendChild(div);
                });
            } catch (e) {
                console.error("Status fetch error", e);
            }
        }
        fetchStatus();
        setInterval(fetchStatus, 2000);
    </script>
</body>
</html>
