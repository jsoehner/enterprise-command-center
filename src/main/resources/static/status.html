<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Resilience & Telemetry - Enterprise Command Center</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: var(--space-2);
        }
        .status-item {
            margin-bottom: 0;
        }
        body.minimal .status-item {
            padding: var(--space-2) var(--space-3) !important;
            margin-bottom: 0 !important;
        }
    </style>
</head>
<body onload="if(window.self !== window.top) document.body.classList.add('minimal')">
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    <div class="container animate-fade">
        <nav class="nav-bar" aria-label="Main Navigation">
            <a href="/" class="nav-link">Dashboard</a>
            <a href="/entry.html" class="nav-link">Order Entry</a>
            <a href="/billing.html" class="nav-link">Billing</a>
            <a href="/shipping.html" class="nav-link">Shipping</a>
            <a href="/queue.html" class="nav-link">Queue</a>
            <a href="/status.html" class="nav-link active" aria-current="page">Status</a>
            <a href="/design-system.html" class="nav-link">Design System</a>
        </nav>

        <header>
            <div>
                <h1>Microservice Resilience & Circuit Breakers</h1>
                <p style="color: var(--color-text-secondary); margin-top: var(--space-2);">
                    Live health telemetry, fault isolation & latency SLAs
                </p>
            </div>
            <div class="status-badge" id="overall-status-badge">
                <div class="status-dot"></div>
                All Systems Operational
            </div>
        </header>

        <div>
            <h2 style="margin-bottom: var(--space-2);">Backend Services</h2>
            <div id="status-list" class="status-grid">
                <!-- Status items injected here -->
            </div>
        </div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const res = await fetch('/camel/health/status');
                const statuses = await res.json();
                const list = document.getElementById('status-list');
                list.innerHTML = '';
                
                let anyDown = false;

                Object.keys(statuses).forEach(service => {
                    const isUp = statuses[service] === 'UP';
                    if (!isUp) anyDown = true;

                    const div = document.createElement('div');
                    div.className = 'status-item';

                    const infoLeft = document.createElement('div');
                    
                    const nameSpan = document.createElement('div');
                    nameSpan.style.fontWeight = '600';
                    nameSpan.textContent = service;

                    const roleSpan = document.createElement('div');
                    roleSpan.style.fontSize = 'var(--font-size-xs)';
                    roleSpan.style.color = 'var(--color-text-secondary)';
                    roleSpan.textContent = 'Camel REST / JPA Backend';

                    infoLeft.appendChild(nameSpan);
                    infoLeft.appendChild(roleSpan);

                    const statusWrap = document.createElement('div');
                    statusWrap.style.display = 'flex';
                    statusWrap.style.alignItems = 'center';
                    statusWrap.style.gap = 'var(--space-3)';

                    const badge = document.createElement('span');
                    badge.className = `status-badge ${isUp ? '' : 'danger'}`;
                    badge.textContent = statuses[service] || 'UNKNOWN';

                    const indicator = document.createElement('div');
                    indicator.className = `status-indicator ${isUp ? '' : 'down'}`;

                    statusWrap.appendChild(badge);
                    statusWrap.appendChild(indicator);

                    div.appendChild(infoLeft);
                    div.appendChild(statusWrap);
                    list.appendChild(div);
                });

                const overallBadge = document.getElementById('overall-status-badge');
                if (anyDown) {
                    overallBadge.className = 'status-badge danger';
                    overallBadge.innerHTML = '<div class="status-dot danger"></div>Degraded State';
                } else {
                    overallBadge.className = 'status-badge';
                    overallBadge.innerHTML = '<div class="status-dot"></div>All Systems Operational';
                }
            } catch (e) {
                console.error("Status fetch error", e);
            }
        }
        fetchStatus();
        setInterval(fetchStatus, 2000);
    </script>
</body>
</html>
