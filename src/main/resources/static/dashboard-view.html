<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REST API Aggregator Dashboard</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body onload="if(window.self !== window.top) document.body.classList.add('minimal')">
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    <div class="container animate-fade">
        <nav class="nav-bar">
            <a href="/" class="nav-link active">Dashboard</a>
            <a href="/entry.html" class="nav-link">Order Entry</a>
            <a href="/billing.html" class="nav-link">Billing</a>
            <a href="/shipping.html" class="nav-link">Shipping</a>
        </nav>
        <header>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <img src="/assets/logo.png" alt="Logo" style="width: 50px; height: 50px;">
                <div>
                    <h1>API Aggregator</h1>
                    <p style="color: var(--text-dim); margin-top: 0.5rem;">Real-time service orchestration & monitoring</p>
                </div>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div>
                System Operational
            </div>
        </header>

        <div style="display: flex; gap: 1rem; margin-bottom: 2rem;">
            <button class="refresh-btn" onclick="fetchData()">Refresh Data</button>
            <div style="color: var(--text-dim); align-self: center;" id="last-updated"></div>
        </div>

        <div class="dashboard-grid" id="dashboard" style="margin-bottom: 2rem;">
            <!-- Cards will be injected here -->
        </div>

        <div class="card" style="width: 100%;">
            <div class="card-title">Live Activity Log</div>
            <div id="activity-log" style="font-family: 'Courier New', monospace; font-size: 0.8rem; color: var(--accent); max-height: 200px; overflow-y: auto;">
                <div>> System initialized. Waiting for data...</div>
            </div>
        </div>
    </div>

    <script src="/js/dashboard.js"></script>
</body>
</html>
