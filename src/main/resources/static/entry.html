<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Entry - REST API Aggregator</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body onload="if(window.self !== window.top) document.body.classList.add('minimal')">
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    <div class="container animate-fade">
        <nav class="nav-bar">
            <a href="/" class="nav-link">Dashboard</a>
            <a href="/entry.html" class="nav-link active">Order Entry</a>
            <a href="/billing.html" class="nav-link">Billing</a>
            <a href="/shipping.html" class="nav-link">Shipping</a>
        </nav>
        <header>
            <h1>New Order Entry</h1>
            <p>Create and queue new work orders</p>
        </header>

        <div class="card" style="max-width: 500px; margin: 0 auto;">
            <form id="order-form">
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem; color: var(--text-dim);">Customer Name</label>
                    <input type="text" id="customer" required style="width: 100%; padding: 0.75rem; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 0.5rem;">
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem; color: var(--text-dim);">Order Amount ($)</label>
                    <input type="number" id="amount" step="0.01" required style="width: 100%; padding: 0.75rem; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 0.5rem;">
                </div>
                <button type="submit" class="btn" style="width: 100%; padding: 1rem; background: var(--primary); color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 700;">Submit Order</button>
            </form>
            <div id="message" style="margin-top: 1rem; text-align: center; color: var(--success);"></div>
        </div>
    </div>

    <script>
        document.getElementById('order-form').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                customer: document.getElementById('customer').value,
                amount: parseFloat(document.getElementById('amount').value)
            };
            
            const res = await fetch('/camel/orders/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            if (res.ok) {
                document.getElementById('message').innerText = 'Order queued successfully!';
                document.getElementById('order-form').reset();
                setTimeout(() => document.getElementById('message').innerText = '', 3000);
            }
        };
    </script>
</body>
</html>
