spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  cache:
    cache-names: buckets
    caffeine:
      spec: expireAfterWrite=1h

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: false

logging:
  level:
    root: INFO
    com.camel.aggregator: INFO
    org.apache.camel: WARN
    com.giffing.bucket4j: WARN
